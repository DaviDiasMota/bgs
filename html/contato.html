<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato</title>
    <script src="https://kit.fontawesome.com/09020c1e82.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="../css/contato.css">
    <script src="../js/limpar.js" defer></script>
</head>
<body>
    <div class="container">

        <div class="nav-container">
            <nav>
                <a href="../index.html">Home Page</a>
                <a href="./detalhes.html">Detalhes do Evento</a>
            </nav>
        </div>

        <section class="titulo">
            <h1>Como prefere falar com a gente?</h1>
        </section>

        <section class="contato">
            <div class="opcao">
                <p class="icon"><i class="fa-regular fa-envelope"></i></p>
                <p class="forma-contato">E-mail</p>
                <p>Ficou com alguma dúvida?</p>

                <p class="forte">XXXXX@gmail.com</p>
            </div>
            <div class="opcao">
                <p class="icon"><i class="fa-solid fa-phone"></i></p>
                <p class="forma-contato">Telefone</p>

                <p>Você pode ligar a qualquer hora.</p>

                <p class="forte">(XX) XXXX-XXXXX</p>
            </div>
        

        <div class="redes">
            <div class="redes-titulo">
                <p>Você também pode entrar em <span class="destaque">contato</span> por aqui.</p>
            </div>
            <div class="redes-icones">
                <a href="#"><i class="fa-brands fa-instagram"></i></a>
                <a href="#"><i class="fa-brands fa-facebook"></i></a>
                <a href="#"><i class="fa-brands fa-discord"></i></a>
            </div>
        </div>
    </div>
    </section>
        <form>
            <h2>Ou nos mande uma mensagem por aqui.</h2>

            <input type="text" placeholder="Digite aqui o seu email" id="input1">

            <input type="text" placeholder="Digite aqui o motivo do contato" id="input2">

            <input type="text" id = "problema"placeholder = "Detalhe aqui o seu problema ou dúvida">

            <button type="button" id="enviar">Enviar</button>

        </form>
    
</body>
</html>
